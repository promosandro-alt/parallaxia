<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARALLAXIA - A Mesma Essência. Outro Ponto de Vista.</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#050507;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
header{background:#000;padding:32px;text-align:center;border-bottom:1px solid rgba(178,75,255,0.2)}header img{max-width:800px;width:92%}

/* ANIMAÇÕES PARALLAXIA */
@keyframes flutuar {
  0%,100% { transform: translateY(0px); }
  50% { transform: translateY(-18px); }
}
@keyframes girarPortal {
  from { transform: translate(-50%,-50%) rotate(0deg); }
  to { transform: translate(-50%,-50%) rotate(360deg); }
}
@keyframes pulsar {
  0%,100% { transform: scale(1); box-shadow: 0 0 20px rgba(178,75,255,0.4); }
  50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(178,75,255,0.8), 0 0 20px rgba(255,138,46,0.6); }
}
@keyframes fadeIn {
  from { opacity:0; transform: translateY(30px); }
  to { opacity:1; transform: translateY(0); }
}

.hero{min-height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;background:radial-gradient(ellipse at center, rgba(178,75,255,0.18) 0%, transparent 72%), #050507;text-align:center}
.hero img{max-width:800px;width:96%;filter:drop-shadow(0 0 50px rgba(178,75,255,0.45)); animation: flutuar 4s ease-in-out infinite, fadeIn 1.2s ease-out;}
.btn{background:linear-gradient(90deg,#B24BFF,#FF8A2E);color:#fff;padding:16px 36px;border-radius:100px;text-decoration:none;display:inline-block;font-weight:bold;letter-spacing:0.12em;margin-top:36px; animation: pulsar 2.5s ease-in-out infinite; transition: all 0.3s;}
.btn:hover{transform: scale(1.1); filter: brightness(1.2);}

.portal{padding:80px 20px;max-width:1200px;margin:0 auto}
.ba{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:520px;border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,0.1)}
.side{padding:40px;display:flex;flex-direction:column;justify-content:flex-end; transition: all 0.6s ease;}
.side:hover{filter: brightness(1.15);}
.left{background:linear-gradient(rgba(0,0,0,0.2),rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=800');background-size:cover;background-position:center}
.right{background:linear-gradient(rgba(0,0,0,0.1),rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=800');background-size:cover;background-position:center}
.label{background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.15);padding:8px 16px;border-radius:100px;font-size:10px;letter-spacing:0.3em;width:fit-content; backdrop-filter: blur(10px);}

.portal-ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:360px;height:360px;z-index:3;pointer-events:none; animation: girarPortal 20s linear infinite;}
.portal-ring img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 30px rgba(178,75,255,0.7)) drop-shadow(0 0 30px rgba(255,138,46,0.6));}

footer{background:#000;padding:60px 20px;text-align:center;border-top:1px solid rgba(255,255,255,0.1)}
footer img{max-width:700px;width:95%; opacity:0.9; transition: all 0.5s;}
footer img:hover{opacity:1; filter: drop-shadow(0 0 20px rgba(178,75,255,0.5));}
@media(max-width:768px){.ba{grid-template-columns:1fr;min-height:760px}.portal-ring{width:220px;height:220px}}
</style>
</head>
<body>
<header><img src="logo_oficial.png" alt="PARALLAXIA"></header>
<section class="hero">
<img src="logo_oficial.png" alt="PARALLAXIA - A Mesma Essência. Outro Ponto de Vista.">
<a href="#obra" class="btn">VER TRANSFORMAÇÕES</a>
</section>
<section id="obra" class="portal">
<div style="text-align:center;margin-bottom:44px"><h2 style="letter-spacing:0.22em;font-size:22px">O PORTAL DE TRANSFORMAÇÃO</h2><p style="color:rgba(255,255,255,0.5);margin-top:10px;letter-spacing:0.15em">O MESMO ESPAÇO, OUTRO PONTO DE VISTA</p></div>
<div class="ba">
<div class="side left"><span class="label">ANTES</span><h3 style="margin-top:16px;font-weight:300">Quintal sem vida</h3></div>
<div class="side right"><span class="label">DEPOIS • PARALLAXIA</span><h3 style="margin-top:16px">Espaço de convivência acolhedor</h3></div>
<div class="portal-ring"><img src="portal_efeito.png" alt="Portal"></div>
</div>
</section>
<footer>
<img src="logo_oficial.png" alt="PARALLAXIA">
<p style="color:rgba(255,255,255,0.35);font-size:11px;letter-spacing:0.22em;margin-top:22px">© 2026 PARALLAXIA • NÚCLEO BANDEIRANTE - DF</p>
</footer>
</body>
</html>
